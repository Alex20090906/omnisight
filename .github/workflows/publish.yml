# Publishes to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored anywhere.
# One-time setup on pypi.org: add a (pending) publisher with
#   owner Alex20090906, repository omnisight, workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
